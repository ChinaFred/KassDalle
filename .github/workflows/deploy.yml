name: Déploiement

# Déploie les Cloud Functions, le web, et les règles Firestore et Storage
# après chaque CI verte sur master. C'est le chemin de déploiement normal, sur
# le PC (commit et push sur master) comme depuis une session cloud (fusion de
# la PR). deploy.ps1 reste l'outil de secours.
#
# L'APK n'est construit que si la version de pubspec.yaml est plus récente
# que celle de l'APK en ligne. Sinon le site garde l'APK et le manifeste déjà
# en ligne (étape « Conserver l'APK en ligne »).
#
# Secrets requis : FIREBASE_SERVICE_ACCOUNT, la clé JSON d'un compte de service
# du projet kassdale-6d948 ; ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
# ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD, la clé de signature du PC. Voir
# documentation/TechnicalRequirements.md, section « Déploiement automatique ».

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Un déploiement à la fois, et jamais interrompu : un déploiement des
# Functions coupé en route laisse une partie des fonctions à l'ancienne
# version.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Commit à déployer
    runs-on: ubuntu-latest
    # Conditions d'un déclenchement automatique :
    # - la CI est verte ;
    # - elle portait sur un push, pas sur une pull request ;
    # - le commit ne vient pas de deploy.ps1, qui vient de tout déployer depuis
    #   le PC : il signe tous ses commits « Deploy-Source: deploy.ps1 ».
    #   Le message seul ne compte pas : un commit poussé à la main peut
    #   commencer par « deploy: », comme le message par défaut du script, et
    #   doit être déployé.
    # Un lancement manuel n'est accepté que sur master : le sélecteur de
    # GitHub propose toutes les branches, et aucune autre n'a de CI validée.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_commit.message, 'Deploy-Source: deploy.ps1'))
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - name: Le commit est la tête de master
        id: tip
        # Relancer une ancienne CI verte, ou un ancien déploiement, remettrait
        # en ligne des Functions, un web et des règles périmés. Seule la tête
        # de master se déploie ; un commit dépassé laisse la place au suivant,
        # qui a sa propre CI.
        env:
          WANTED: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$REPO/commits/master" --jq .sha)
          if [ "$tip" != "$WANTED" ]; then
            echo "::notice::$WANTED n'est plus la tête de master ($tip) : rien à déployer."
            exit 0
          fi
          echo "sha=$WANTED" >> "$GITHUB_OUTPUT"

  deploy:
    name: Functions, web, APK, règles
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kass_dalle
    steps:
      - name: Le commit est toujours la tête de master
        # Refait ici : « Re-run failed jobs » ne rejoue pas le job gate et
        # réutilise son ancien résultat.
        env:
          WANTED: ${{ needs.gate.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          tip=$(gh api "repos/$REPO/commits/master" --jq .sha)
          if [ "$tip" != "$WANTED" ]; then
            echo "::error::$WANTED n'est plus la tête de master ($tip) : déploiement refusé."
            exit 1
          fi

      - name: Libérer de la place sur le disque
        # Le 8 octobre 2026, trois tentatives se sont arrêtées sur « No space
        # left on device » : SDK Flutter, caches Gradle, build de l'APK et
        # build web remplissent le disque du runner. On retire des outils
        # préinstallés dont le déploiement ne se sert pas. Le SDK Android
        # (/usr/local/lib/android) reste : le build de l'APK l'utilise.
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          sudo docker image prune --all --force > /dev/null \
            || echo "::warning::Images Docker non supprimées."
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kass_dalle/functions/package-lock.json

      - name: Dépendances
        run: |
          flutter pub get
          npm ci --prefix functions

      - name: Build web
        # Mêmes options que deploy.ps1.
        run: flutter build web --release --no-tree-shake-icons --no-wasm-dry-run

      - name: Vérifier l'APK en ligne
        timeout-minutes: 10
        # Avant tout déploiement : une paire incohérente arrêterait sinon le
        # workflow après les Functions, et laisserait des Functions neuves
        # avec un web ancien. Le téléchargement est refait avant le hosting.
        run: ../.github/scripts/keep-online-apk.sh "$RUNNER_TEMP/apk-check"

      - name: Faut-il un nouvel APK ?
        id: apk
        run: ../.github/scripts/build-apk.sh decide "$RUNNER_TEMP/apk-check/apk_release.json"

      - uses: actions/setup-java@v4
        if: steps.apk.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'APK
        # Avant tout déploiement : un secret absent ou un build en échec arrête
        # le workflow avant que les Functions ne partent. La clé et
        # key.properties sont supprimés à la sortie du script.
        if: steps.apk.outputs.build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../.github/scripts/build-apk.sh build

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Déployer les Functions
        # Budget de découverte du bundle, comme dans deploy.ps1.
        # --force : en mode non interactif, la CLI refuse sinon de supprimer
        # une fonction retirée du code. Il n'est passé qu'ici : sur firestore,
        # il supprimerait les index absents de firestore.indexes.json.
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: '120'
        run: ../.github/scripts/firebase-deploy.sh functions 2 --force

      - name: Conserver l'APK en ligne
        timeout-minutes: 10
        if: steps.apk.outputs.build != 'true'
        # Juste avant le hosting : plus la copie est tardive, plus la fenêtre
        # est courte où un deploy.ps1 publierait un APK neuf que ce
        # déploiement écraserait.
        run: ../.github/scripts/keep-online-apk.sh build/web

      - name: Revérifier l'APK en ligne
        timeout-minutes: 15
        if: steps.apk.outputs.build == 'true'
        # Le build de l'APK et les Functions durent plus de dix minutes. Un
        # deploy.ps1 a pu publier entre-temps un APK plus récent que celui
        # construit ici : il est alors conservé, au lieu d'être remplacé par
        # une version plus ancienne.
        # Un échec ici laisse les Functions neuves avec le web précédent :
        # relancer le workflow (« Re-run all jobs ») une fois la cause réglée.
        run: |
          # Le manifeste suffit à comparer les versions : l'APK en ligne n'est
          # téléchargé que s'il faut le conserver. Un manifeste absent rend
          # index.html (réécriture « ** ») : il est alors écarté.
          manifest="$RUNNER_TEMP/apk-recheck.json"
          curl -sS --fail --max-time 60 -o "$manifest" https://kassdale-6d948.web.app/apk_release.json
          if ! jq -e '.version | strings' "$manifest" > /dev/null 2>&1; then
            rm -f "$manifest"
          fi
          decision=$(mktemp)
          GITHUB_OUTPUT="$decision" ../.github/scripts/build-apk.sh decide "$manifest"
          if grep -q '^build=false$' "$decision"; then
            echo "::warning::Un APK aussi récent ou plus récent est en ligne depuis le début du workflow : il est conservé."
            ../.github/scripts/keep-online-apk.sh build/web
          fi

      - name: Déployer le web et les règles
        run: ../.github/scripts/firebase-deploy.sh hosting,firestore,storage

      - name: Résumé
        env:
          APK_BUILT: ${{ steps.apk.outputs.build }}
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          sha=$(git rev-parse --short HEAD)
          {
            echo "### Déployé : v$version ($sha)"
            echo
            echo "Functions, web, règles Firestore et Storage."
            if [ "$APK_BUILT" = true ]; then
              echo "Nouvel APK publié : v$(jq -r .version build/web/apk_release.json)."
            elif [ -f build/web/apk_release.json ]; then
              echo "APK en ligne inchangé : v$(jq -r .version build/web/apk_release.json)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
