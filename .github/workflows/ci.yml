name: CI

# Filet de sécurité du projet : chaque push et chaque pull request rejoue
# l'analyse statique, les tests et les builds. Sans cette CI, les règles du
# projet (aucun catch silencieux, zéro warning) ne tiennent que le temps
# de la session qui les a appliquées.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule : la CI ne publie rien, n'écrit ni commentaire ni statut.
permissions:
  contents: read

# Actions épinglées par SHA de commit, version en commentaire, comme dans
# deploy.yml : une étiquette se déplace, un SHA ne change pas de contenu.

jobs:
  version:
    name: Version — numéro libre
    runs-on: ubuntu-latest
    # Le PC pousse sur master pendant que des PR attendent leur fusion. Deux
    # livraisons qui passent toutes deux de 0.23.14 à 0.23.15 fusionnent sans
    # conflit dans pubspec.yaml, et la seconde ne reconstruit pas l'APK. Voir
    # .github/scripts/check-version.sh. Un lancement manuel n'a pas de base :
    # le contrôle ne tourne que sur un push et une pull request.
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # L'historique complet : le script compare chaque commit à son parent.
          fetch-depth: 0

      - name: Version supérieure à master
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # La master du moment, pas la base figée à l'ouverture de la PR.
            git fetch --quiet origin master
            .github/scripts/check-version.sh FETCH_HEAD "$PR_HEAD"
          else
            .github/scripts/check-version.sh "$BEFORE" "$GITHUB_SHA"
          fi

  deja-teste:
    name: Déjà testé en PR
    runs-on: ubuntu-latest
    # Une PR fusionnée relançait les trois jobs lourds sur master, environ
    # douze minutes facturées, pour un contenu que sa CI venait de valider.
    # Le push de fusion les saute quand trois conditions tiennent :
    # - le commit poussé a le même arbre que la tête d'une PR vers master qui
    #   lui est associée (rien n'a été ajouté à la fusion) ;
    # - cette tête contient déjà la master d'avant le push : la CI de la PR,
    #   qui teste la fusion avec master, a donc testé ce même arbre ;
    # - toutes les exécutions de cette CI en pull_request sur cette tête ont
    #   réussi, aucune n'est en cours.
    # Le job Version tourne toujours : il compare à la master d'avant le push.
    # Une réponse d'API manquante ou inattendue fait tourner la CI entière.
    if: github.event_name == 'push'
    # Ces droits restent dans ce job : les jobs lourds exécutent le code de la
    # PR et n'ont pas à lire les autres exécutions.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: La tête de la PR fusionnée a-t-elle déjà une CI verte ?
        id: check
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if ! tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) ||
             ! heads=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.base.ref == "master") | .head.sha'); then
            echo "::warning::Lecture de l'API impossible : la CI tourne en entier."
            heads=""
          fi
          for head in $heads; do
            head_tree=$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha) || continue
            [ "$head_tree" = "$tree" ] || continue
            status=$(gh api "repos/$REPO/compare/$BEFORE...$head" --jq .status) || continue
            case "$status" in ahead|identical) ;; *) continue ;; esac
            # Toutes les CI de PR de cette tête doivent être vertes : la même
            # tête peut viser une autre branche dans une seconde PR, ou avoir
            # une CI encore en cours ou rouge.
            all_green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request" \
              --jq '[.workflow_runs[].conclusion] | length > 0 and all(. == "success")') || continue
            if [ "$all_green" = "true" ]; then
              echo "::notice::Arbre identique à $head, CI de PR verte : jobs lourds sautés."
              skip=true
              break
            fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter — analyse et tests
    needs: deja-teste
    # !cancelled() : sur une PR ou un lancement manuel, deja-teste est sauté et
    # sa sortie est vide.
    if: ${{ !cancelled() && needs.deja-teste.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kass_dalle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        # Strict : erreurs, warnings ET infos sont bloquants. Le code part de
        # zéro diagnostic — le laisser dériver coûte plus cher que de corriger
        # au fil de l'eau.
        run: flutter analyze

        # Le dépôt a dérivé pendant des mois : 53 fichiers n'étaient pas
        # formatés, si bien qu'un `dart format` lancé sur un fichier en
        # reformatait dix autres au passage et noyait chaque diff. Une règle
        # de style qui n'est pas vérifiée n'est pas une règle.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

        # `pub get` doit rester reproductible : un pubspec.lock désynchronisé
        # signifie que la CI et la machine de dev ne buildent pas la même chose.
      - name: Vérifier que pubspec.lock est à jour
        run: git diff --exit-code pubspec.lock

      - name: Tests
        run: flutter test

      - name: Build web (vérifie que la release compile)
        run: flutter build web --release

  functions:
    name: Cloud Functions — lint et build
    needs: deja-teste
    if: ${{ !cancelled() && needs.deja-teste.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kass_dalle/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kass_dalle/functions/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

        # Pendant de `dart format` côté Flutter. ESLint ne porte ici que des
        # règles de correction, aucune de style : sans ce contrôle, rien ne
        # tenait la mise en forme du TypeScript.
      - name: Format
        run: npm run format:check

      - name: Build TypeScript
        run: npm run build

        # Rejoue les fixtures de kass_dalle/test-fixtures/, les mêmes que la
        # suite Dart : c'est ce qui détecte une divergence entre le parseur
        # CookLang du client et celui du backend.
      - name: Tests (fixtures partagées avec Dart)
        run: npm test

  rules:
    name: Règles — émulateur
    needs: deja-teste
    if: ${{ !cancelled() && needs.deja-teste.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kass_dalle/rules-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kass_dalle/rules-tests/package-lock.json

        # Les émulateurs Firestore et Storage tournent sur la JVM.
        # firebase-tools 15 refuse de les lancer avant Java 21
        # (MIN_SUPPORTED_JAVA_MAJOR_VERSION) : 17 ne suffit pas.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

        # Les binaires des émulateurs sont téléchargés par firebase-tools au
        # premier lancement. La clé suit la version épinglée de firebase-tools.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('kass_dalle/rules-tests/package-lock.json') }}

      - name: Dépendances
        run: npm ci

        # Rejoue firestore.rules et storage.rules du dépôt, rôle par rôle, sur
        # le projet fictif demo-kassdalle : aucun contact avec la production.
        # Un test marqué `todo` décrit une faille encore ouverte et n'échoue
        # pas la suite ; tous les autres sont bloquants, et une CI rouge
        # bloque le déploiement (deploy.yml exige une CI `success`).
      - name: Tests des règles Firestore et Storage
        run: npm test
