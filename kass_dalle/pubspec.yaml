name: kass_dalle
description: "Kass'dalle - Livre de cuisine digital familial"
publish_to: 'none'

version: 0.20.11+111

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Traductions des widgets Material/Cupertino fournis par Flutter. Sans elles,
  # le sélecteur de date du planning affiche « Select date » et « Cancel » dans
  # une application entièrement écrite en français.
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.3.1
  firebase_storage: ^13.3.0

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Pas de SDK Gemini côté client : l'IA passe exclusivement par les Cloud Functions.

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.3

  # Image (mobile)
  image_picker: ^1.2.2
  image_cropper: ^12.2.1

  # File picker (web/desktop)
  file_picker: ^11.0.2

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  http: ^1.2.0
  intl: ^0.20.0
  crop_your_image: ^2.0.0
  image: ^4.8.0
  flutter_image_compress: ^2.4.0
  shared_preferences: ^2.3.5
  package_info_plus: ^8.0.0
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1

  # Interop web (remplace dart:html, déprécié et absent en WebAssembly)
  web: ^1.1.0

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Firestore en mémoire. Chaque repository accepte déjà un FirebaseFirestore
  # injecté : le vrai code des repositories est donc rejoué tel quel, sans
  # émulateur ni réseau.
  fake_cloud_firestore: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/Icon.png
    - assets/mycreations.png
    - assets/opensource.png
    - assets/Secret.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  image_path: "assets/Icon.png"
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
