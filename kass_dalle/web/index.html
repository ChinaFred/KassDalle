<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion de recettes et planification de repas">
  <meta name="theme-color" content="#6B7B3A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kass'Dalle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kass'Dalle</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Force le nouveau service worker à s'activer immédiatement sans attendre.
    // - Détecte un SW déjà en "waiting" au chargement (cas Chrome Android après deploy)
    // - Force registration.update() pour bypasser la mise en cache HTTP du SW
    // - Reload dès qu'un nouveau SW prend le contrôle
    if ('serviceWorker' in navigator) {
      var reloadInProgress = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloadInProgress) return;
        reloadInProgress = true;
        window.location.reload();
      });
      navigator.serviceWorker.ready.then(function (registration) {
        // 1) Si un nouveau SW est déjà en attente, on lui dit de prendre la main.
        if (registration.waiting) {
          registration.waiting.postMessage('skip-waiting');
        }
        // 2) Détection des futures mises à jour (ouverture longue durée).
        registration.addEventListener('updatefound', function () {
          var newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function () {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage('skip-waiting');
            }
          });
        });
        // 3) Force un check de mise à jour au chargement (Chrome Android ne le fait
        //    pas toujours sur un simple F5).
        registration.update().catch(function () {});
      });
    }
  </script>
</body>
</html>
